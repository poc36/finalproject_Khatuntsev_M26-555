[project]
name = "finalproject-khatuntsev-m26-555"
version = "0.1.0"
description = "Currency trading simulation platform (ValutaTrade Hub)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:run"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_file = "logs/actions.log"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
